server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 带 hash 的构建产物可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 前端按 VITE_BASE=/admin/ 构建，资源引用形如 /admin/assets/xxx。
    # 直接访问本容器端口（如 http://localhost:3001）时，把 /admin/ 前缀剥掉后
    # 自我反向代理，复用下面的 location /，这样根路径和 /admin/ 两种访问方式都能用。
    # （上游 nginx 的 location /admin/ 会先剥掉前缀再转发到这里，不经过这一段）
    location /admin/ {
        proxy_pass http://127.0.0.1:80/;
        proxy_set_header Host $host;
    }

    # SPA history 路由回退，刷新 /admin/articles 之类的深链接不会 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
