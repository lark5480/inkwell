# Inkwell - 中间件 + 应用容器编排
#
# 仅启动中间件（后端/前端在本地 IDE 运行）：docker compose up -d mysql redis minio
# 完全部署：docker compose up -d
# 查看日志：docker compose logs -f
# 停止：docker compose down
# 清理（删除数据卷）：docker compose down -v

services:
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=blog
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "3306:3306"
    networks:
      - blog-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - blog-network

  minio:
    image: minio/minio
    container_name: blog-minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - blog-network

  blog-server:
    build: ./blog-server
    container_name: blog-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://blog-mysql:3306/blog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    networks:
      - blog-network

  blog-web:
    build: ./blog-web
    container_name: blog-web
    restart: unless-stopped
    depends_on:
      - blog-server
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE=http://blog-server:8080/api
    networks:
      - blog-network

  blog-admin:
    build: ./blog-admin
    container_name: blog-admin
    restart: unless-stopped
    depends_on:
      - blog-server
    ports:
      - "3001:80"
    networks:
      - blog-network

  nginx:
    image: nginx:alpine
    container_name: blog-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - blog-web
      - blog-admin
      - blog-server
    networks:
      - blog-network

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  blog-network:
    driver: bridge
