# Inkwell - 中间件 + 应用容器编排
#
# 仅启动中间件（后端/前端在本地 IDE 运行）：docker compose up -d mysql redis minio
# 完全部署：docker compose up -d
# 查看日志：docker compose logs -f
# 停止：docker compose down
# 清理（删除数据卷）：docker compose down -v

services:
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=blog
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    networks:
      - blog-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - blog-network

  minio:
    image: minio/minio
    container_name: blog-minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - blog-network

  blog-server:
    build: ./blog-server
    container_name: blog-server
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://blog-mysql:3306/blog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      # application-docker.yml 里 jwt.secret 是无默认值的 ${JWT_SECRET}，必须注入。
      # ⚠️ 下面这个默认值是仓库里公开的开发占位密钥，仅供本地 docker compose 起服务；
      #    生产环境（任何公网可访问的机器）必须换成自己的：openssl rand -base64 48
      #    否则任何人都能拿公开密钥伪造管理员 token —— 生产请直接用 docker-compose.prod.yml
      - JWT_SECRET=${JWT_SECRET:-ZDNrM2VyaG5sZGtmamh3MmVybGprM2gzNGtsamhmMzRsa2ozNGh3bDNramZoc2xramYzaGxzYWtqZGZoZmxrYWpoMzJsa2ZhamhzZGZsa2Fqc2hkZmxra2FqM2g0bGthanNm}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      # 正文插图（/api/web/user/articles/upload-image-content）永远存在本地 ./uploads，
      # 不挂载的话容器一重建图片就全丢，务必持久化
      - ./uploads:/app/uploads
    networks:
      - blog-network

  blog-web:
    build: ./blog-web
    container_name: blog-web
    restart: unless-stopped
    depends_on:
      - blog-server
    ports:
      - "3000:3000"
    environment:
      # SSR 直连后端容器；浏览器端走同源 /api（由 nginx 转发），无需暴露 8080
      - NUXT_API_BASE=http://blog-server:8080
      - NUXT_PUBLIC_SITE_URL=${SITE_URL:-http://localhost:3000}
    networks:
      - blog-network

  blog-admin:
    build:
      context: ./blog-admin
      args:
        # 管理后台挂在 /admin/ 子路径下（与 nginx/nginx.conf 的 location /admin/ 对应）
        VITE_BASE: /admin/
    container_name: blog-admin
    restart: unless-stopped
    depends_on:
      - blog-server
    ports:
      - "3001:80"
    networks:
      - blog-network

  nginx:
    image: nginx:alpine
    container_name: blog-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - blog-web
      - blog-admin
      - blog-server
    networks:
      - blog-network

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  blog-network:
    driver: bridge
