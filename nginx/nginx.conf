worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Gzip settings
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_vary on;
    gzip_proxied any;

    # Client max body size (for image uploads)
    client_max_body_size 10m;

    # Proxy buffer settings
    proxy_buffers 16 4k;
    proxy_buffer_size 2k;
    proxy_busy_buffers_size 8k;
    proxy_temp_file_write_size 8k;

    # Upstream definitions
    upstream blog_server {
        server blog-server:8080;
    }

    upstream blog_web {
        server blog-web:3000;
    }

    upstream blog_admin {
        server blog-admin:80;
    }

    server {
        listen 80;
        server_name localhost blog.example.com;

        # API requests -> blog-server
        location /api/ {
            proxy_pass http://blog_server/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin requests -> blog-admin
        location /admin/ {
            proxy_pass http://blog_admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # All other requests -> blog-web (Nuxt)
        location / {
            proxy_pass http://blog_web/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
