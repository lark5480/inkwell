worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Gzip settings
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_vary on;
    gzip_proxied any;

    # Client max body size (for image uploads) —— 后端单文件上限 10MB，这里留出余量
    client_max_body_size 20m;

    # Proxy buffer settings
    proxy_buffers 16 4k;
    proxy_buffer_size 2k;
    proxy_busy_buffers_size 8k;
    proxy_temp_file_write_size 8k;

    # Docker 内嵌 DNS。必须配 + upstream 里加 resolve：
    # 容器重建后 IP 会变（实测 blog-web/blog-admin 的 IP 会对调），nginx 只在启动时解析一次的话，
    # 会一直向旧 IP 转发 → 前端全部 502。加上动态解析后，每次部署无需重启 nginx。
    # 需要 nginx >= 1.27.3（nginx:alpine 当前为 1.31.x）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upstream definitions
    upstream blog_server {
        zone blog_server 64k;
        server blog-server:8080 resolve;
    }

    upstream blog_web {
        zone blog_web 64k;
        server blog-web:3000 resolve;
    }

    upstream blog_admin {
        zone blog_admin 64k;
        server blog-admin:80 resolve;
    }

    server {
        listen 80;
        # 用 IP 直接访问时 server_name 写 _ 即可；有域名后改成你的域名
        server_name _;

        # API requests -> blog-server
        location /api/ {
            proxy_pass http://blog_server/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # 本地存储的上传图片 -> blog-server（后端从 /app/uploads 读取）
        location /uploads/ {
            proxy_pass http://blog_server/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Admin requests -> blog-admin（去掉 /admin/ 前缀后转发，
        # 因为管理后台是按 VITE_BASE=/admin/ 构建的静态站点）
        location /admin/ {
            proxy_pass http://blog_admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # RSS / Sitemap 由后端单点生成（文章与站点设置都在那边），
        # 必须用 = 精确匹配，否则会被下面的 location / 交给 Nuxt
        location = /rss.xml {
            proxy_pass http://blog_server/api/web/rss.xml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /sitemap.xml {
            proxy_pass http://blog_server/api/web/sitemap.xml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # All other requests -> blog-web (Nuxt SSR)
        location / {
            proxy_pass http://blog_web/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ------------------------------------------------------------------------
    # HTTPS（可选）：申请证书后取消注释，并把上面的 80 端口 server 改成跳转
    #
    #   1) 域名解析到服务器公网 IP，安全组放通 443
    #   2) 宿主机安装 certbot：
    #      sudo apt install -y certbot
    #      sudo certbot certonly --standalone -d blog.example.com
    #      sudo cp /etc/letsencrypt/live/blog.example.com/fullchain.pem ./nginx/certs/
    #      sudo cp /etc/letsencrypt/live/blog.example.com/privkey.pem   ./nginx/certs/
    #   3) docker-compose.prod.yml 里放开 443 端口映射，并挂载 ./nginx/certs:/etc/nginx/certs:ro
    #   4) 取消下面这段注释，重启 nginx
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name blog.example.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     # 与 80 端口完全相同的 location 配置
    # }
    # ------------------------------------------------------------------------
}
